name: Check, refresh and publish
on:
  push:
    branches: [main]
    paths-ignore:
      - 'projects/**/site/data/**'
      - 'projects/**/docs/data/**'
      - 'projects/**/state/**'
      - 'projects/mlb-edge/data/**'
      - 'projects/bet-ledger-hq/data/**'
      - 'projects/props-edge/site/data/**'
  pull_request:
  workflow_dispatch:
    inputs:
      sport:
        description: Models to refresh
        type: choice
        options: [all, football, mlb, wnba, nhl, props, ladder, archive]
        default: all
  schedule:
    - cron: '23 */3 * * *'
    - cron: '7,37 * * * *'
    # Game-day football refreshes. Inactives post ~90 min before kickoff, so
    # a :53 run lands ~67 min before a :00 kickoff. Sunday starts at 12 UTC to
    # catch London games (9:30 ET); Monday is included for Monday Night.
    - cron: '53 12-23 * * 0'
    - cron: '53 15-23 * * 1,4,5,6'

permissions:
  contents: read
concurrency:
  group: kevbot-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    steps:
      # A queued run keeps the commit it was triggered on (github.sha). Runs
      # wait on each other (concurrency above) and each one commits fresh
      # data, so a run that waited would otherwise build stale code and then
      # refuse to save. Runs on main therefore build whatever main is when
      # they START; pull requests and other branches build their own commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'main' || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pip install -r requirements-lock.txt
      - run: npm ci --ignore-scripts
        working-directory: projects/bet-ledger-hq
      - run: npx playwright install --with-deps chromium
        working-directory: projects/bet-ledger-hq
      - name: Offline release checks
        run: python tools/verify.py --browser
      - name: Refresh real data
        if: github.event_name != 'pull_request'
        env:
          REQUESTED_SPORT: ${{ inputs.sport || 'all' }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MLB_SEASON: ${{ vars.MLB_SEASON || '2026' }}
          MLB_BANKROLL: ${{ vars.MLB_BANKROLL || '250' }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          sport="$REQUESTED_SPORT"
          if [ "$EVENT_SCHEDULE" = '53 12-23 * * 0' ] || [ "$EVENT_SCHEDULE" = '53 15-23 * * 1,4,5,6' ]; then sport=football; fi
          if [ "$EVENT_SCHEDULE" = '7,37 * * * *' ]; then sport=nhl; fi
          python tools/refresh.py --sport "$sport"
          node projects/mlb-edge/tests/test_sim.mjs projects/mlb-edge/docs/data
          python -m unittest discover -s tests
      - name: Save public model history
        id: save
        if: github.event_name != 'pull_request'
        run: |
          built=$(git rev-parse HEAD)
          git config user.name 'kevbot-model[bot]'
          git config user.email 'actions@users.noreply.github.com'
          python tools/stage_history.py
          saved=true
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh public model data and frozen forecasts'
            saved=false
          fi
          # Someone may push code while this run is building. The refreshed data
          # is still worth keeping (line snapshots, frozen forecasts, CLV locks),
          # so it is replayed on top of the new commit -- but the site is left
          # to the next run, since this one built the older code.
          publish=true
          for attempt in 1 2 3; do
            git fetch origin main
            [ "$(git rev-parse origin/main)" != "$built" ] && publish=false
            [ "$saved" = true ] && break
            # The model builds also rewrite tracked files that are not model
            # history (caches, scratch state). Those are left unstaged on
            # purpose, and a plain rebase refuses to run at all with them
            # present -- even when there is nothing to replay. --autostash
            # sets them aside and puts them back. `rebase --abort` exits 128
            # when no rebase started, so it must not be allowed to fail the step.
            if ! git rebase --autostash origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "::warning::Refreshed data conflicted with a newer commit on main and was not saved; the next run refreshes it again."
              break
            fi
            if git push origin HEAD:main; then saved=true; break; fi
            if [ "$attempt" = 3 ]; then echo "::error::Could not save refreshed data after 3 attempts."; exit 1; fi
          done
          if [ "$publish" = false ]; then
            echo "::notice::main moved during this build, so the refreshed data was saved on top of it and publishing is left to the next run, which builds the newer code."
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && steps.save.outputs.publish == 'true'
        with:
          path: _site
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation
          path: |
            validation.json
            projects/bet-ledger-hq/test-results/
  publish:
    if: github.event_name != 'pull_request' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
