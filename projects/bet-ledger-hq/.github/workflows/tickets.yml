name: Archive Top Picks
on:
  push:
    branches: [main]
    paths: ['*.js', '*.html', '*.css', '*.webmanifest', '*.png', 'apps-script/**', 'sports.json', 'scripts/**', 'assets/**', '.github/workflows/tickets.yml']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kevbot-ticket-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect, freeze and verify
        id: collect
        continue-on-error: true
        run: node scripts/refresh-tickets.mjs
      - name: Save forward-only archive
        run: |
          git config user.name 'kevbot-archive[bot]'
          git config user.email 'kevbot-archive[bot]@users.noreply.github.com'
          git add data/tickets
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Top Picks and refresh verified results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Surface collection failures
        if: steps.collect.outcome == 'failure'
        run: exit 1
