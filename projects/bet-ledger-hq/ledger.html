<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Shared ledger · KEVBOTBETS</title>
<meta name="description" content="Every bet from every board, in one place.">
<style>
/* Dark-first by intent: this is a desk you read at night. The palette is the
   MLB Edge board's, so moving between them does not feel like moving apps. */
:root{
  --bg:#0b0f14; --panel:#121821; --panel2:#161e29; --line:#222d3b;
  --ink:#e8eef6; --dim:#8ea0b5; --faint:#7b8ea6;
  --accent:#4cc2ff; --good:#3ddc97; --warn:#ffc857; --bad:#ff6b6b;
  --gold:#ffd166;
  /* Categorical identity for the five boards - the validated dark steps.
     Always shown beside the board's name, never as the only signal. */
  --b1:#3987e5; --b2:#d95926; --b3:#199e70; --b4:#c98500; --b5:#d55181;
  /* Money is diverging: profit and loss are opposites, zero is nothing. */
  --pos:#3ddc97; --neg:#ff6b6b; --mid:#2a3646;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f7fa; --panel:#ffffff; --panel2:#eef3f8; --line:#d7e0ea;
    --ink:#0e1720; --dim:#4f6479; --faint:#5f7186;
    --accent:#0a6fbd; --good:#0a7a4a; --warn:#9a6510; --bad:#c0392f;
    --gold:#8a6209;
    --b1:#2a78d6; --b2:#eb6834; --b3:#1baf7a; --b4:#eda100; --b5:#e87ba4;
    --pos:#0a7a4a; --neg:#c0392f; --mid:#d7e0ea;
  }
}
:root[data-theme="light"]{
  --bg:#f4f7fa; --panel:#ffffff; --panel2:#eef3f8; --line:#d7e0ea;
  --ink:#0e1720; --dim:#4f6479; --faint:#5f7186;
  --accent:#0a6fbd; --good:#0a7a4a; --warn:#9a6510; --bad:#c0392f;
  --gold:#8a6209;
  --b1:#2a78d6; --b2:#eb6834; --b3:#1baf7a; --b4:#eda100; --b5:#e87ba4;
  --pos:#0a7a4a; --neg:#c0392f; --mid:#d7e0ea;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);
  padding:0 0 max(28px,env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
h1{font-size:20px;font-weight:660;letter-spacing:-.02em;margin:0}
h2{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);margin:26px 0 10px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--dim)}

header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 0 11px}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd .sub{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}

button,select,input{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:transparent;color:#05131d}
.btn.sm{padding:5px 9px;font-size:12px;font-weight:600;border-radius:7px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-size:13px;font-family:var(--mono)}
input:focus,select:focus{outline:none;border-color:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.kpi span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.kpi b{display:block;margin-top:4px;font:650 21px/1.15 var(--mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.kpi i{display:block;margin-top:3px;font-style:normal;font-size:11.5px;color:var(--faint)}

.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:14px 0 0}
.filters .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;
  vertical-align:baseline;flex:none}

/* ------------------------------------------------------------------ charts */
figure{margin:0}
figcaption{font-size:12px;color:var(--dim);margin:0 0 8px}
.plot{position:relative;width:100%}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.grid line{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.axis text{fill:var(--faint);font:400 10.5px/1 var(--mono)}
.curve{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.curve-fill{fill:var(--accent);opacity:.08}
.zero{stroke:var(--dim);stroke-width:1;stroke-dasharray:none;opacity:.5}
.cross{stroke:var(--faint);stroke-width:1;opacity:.65}
.endcap{fill:var(--accent);stroke:var(--bg);stroke-width:2}
/* The end label can land on the curve when the last bet is also the high point.
   A halo in the page's own colour keeps it readable without a box. */
.endlabel{fill:var(--ink);font:620 12px/1 var(--mono);paint-order:stroke;
  stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;font-size:12px;line-height:1.45;white-space:nowrap;
  box-shadow:0 8px 22px rgba(0,0,0,.35);z-index:5}
.tip b{font-family:var(--mono)}

.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:112px 1fr 82px;gap:10px;align-items:center;font-size:13px}
.bar-track{position:relative;height:11px;background:var(--panel2);border-radius:4px}
.bar-track i{position:absolute;top:0;height:11px;border-radius:3px}
.bar-track .axis0{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--mid)}
@media(max-width:560px){.bar-row{grid-template-columns:96px 1fr 70px;font-size:12.5px}}

/* ------------------------------------------------------------------ tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);font-weight:650;padding:0 10px 7px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--panel2)}

.bet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;margin-bottom:8px}
.bet .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bet .nm{font-weight:640;font-size:14.5px}
.bet .meta{color:var(--dim);font-size:12px;margin-top:2px}
.bet .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.bet input{width:88px}
.bet .settle{display:flex;gap:6px;margin-left:auto}
@media(max-width:560px){
  .bet .acts{gap:8px}
  .bet .settle{margin-left:0;width:100%;justify-content:space-between}
  .bet .settle .btn{flex:1}
}
.pill{font:650 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;
  padding:4px 7px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
.pill.Win{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 45%,transparent)}
.pill.Loss{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 45%,transparent)}
.pill.Pending{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

.empty{color:var(--dim);font-size:13.5px;padding:16px 2px}
.note{color:var(--dim);font-size:12.5px;line-height:1.6}
.gate{max-width:440px;margin:48px auto}
.gate label{display:block;margin:12px 0 0;font-size:12px;color:var(--dim)}
.gate input{width:100%;margin-top:5px}
.gate .btn{width:100%;margin-top:14px}
.err{margin-top:12px;padding:10px 11px;border-radius:9px;font-size:12.5px;
  border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);
  background:color-mix(in srgb,var(--bad) 9%,transparent)}
[hidden]{display:none!important}
.recovery-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:10px 0}.recovery-actions .btn{min-height:42px}.recovery-dialog{width:min(620px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px}.recovery-dialog::backdrop{background:#000b}.recovery-dialog p{line-height:1.6}.recovery-dialog button:disabled{opacity:.5}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <h1>Ledger HQ</h1>
    <button class="btn sm" id="sync" hidden>Sync</button>
    <div class="sub" id="stamp"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<script src="betsync.js"></script>
<script src="ledger-details.js"></script>
<script src="ledger-recovery.js"></script>
<script src="ledger-recovery-view.js"></script>
<script src="hq.js"></script>
</body>
</html>
