name: Ladder

on:
  push:
    branches: [main]
  schedule:
    # Check every hour. If the committed pending wager has finished, the first
    # step grades it, advances on a win or resets on a loss, and the same run
    # republishes the option board for the newly-active rung.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      settle_as:
        description: "Force the pending result instead of auto-grading"
        type: choice
        options: [auto, win, loss, push, skip]
        default: auto

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ladder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Install test runner
        run: python -m pip install pytest

      - name: 1. Settle any finished pending bet
        if: inputs.settle_as != 'skip'
        run: python -m ladder settle "${{ inputs.settle_as || 'auto' }}"

      - name: 2. Verify ladder progression
        run: |
          python -m pytest -q tests
          node tests/test_webledger.mjs
          node tests/test_sync.mjs

      - name: 3. Build next-rung option board and report
        run: |
          { echo '```'; NO_COLOR=1 python -m ladder pick --top 10; echo;
            NO_COLOR=1 python -m ladder status; echo;
            NO_COLOR=1 python -m ladder ledger --limit 10; echo '```'; } > pick.md
          python -m ladder render --out docs/index.html
          python tools/patch_dashboard.py
          cat pick.md

      - name: 4. Post to issue
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pick.md','utf8') +
              `\n[Dashboard](https://${context.repo.owner}.github.io/${context.repo.repo}/)` +
              `\n\nIf you took a different price, run: ` +
              '`python -m ladder amend --price 1.52`';
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Ladder — ${new Date().toISOString().slice(0,10)}`,
              body, labels: ['ladder']
            });

      - name: 5. Commit state
        run: |
          mkdir -p picks && cp pick.md "picks/$(date -u +%F).md"
          git config user.name  "ladder-bot"
          git config user.email "ladder-bot@users.noreply.github.com"
          git add state picks docs
          git diff --staged --quiet || git commit -m "ladder: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
