name: Refresh model

# Credential-free refresh using public data only. NFL prices, injury reports and
# weather move fastest from Thursday through Monday, so those days refresh every
# two hours. Tuesday-Wednesday use a lighter four-hour cadence.
#
# Times are UTC and GitHub's scheduler is best-effort. This is a regularly
# refreshed market model, not a live in-game odds feed.
on:
  push:
    branches: [main]
    # Source/config uploads rebuild immediately. Generated-data commits do not
    # match these paths, so the bot cannot trigger itself in a loop.
    paths:
      - ".github/workflows/refresh.yml"
      - "pipeline/**"
      - "config/**"
      - "tests/**"
      - "tools/**"
      - "site/**"
      - "requirements.txt"
  schedule:
    - cron: "17 */4 * * 2-3"
    - cron: "17 */2 * * 0,1,4,5,6"
  workflow_dispatch:
    inputs:
      full:
        description: "Full-season backfill (slow, rebuilds the cache)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: nfl-edge-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the keyless odds parser
        run: python -m unittest discover -s tests -v

      - name: Verify the manual browser ledger
        run: node tests/test_ledger.mjs

      - name: Browser staking tests
        run: node tests/test_staking.mjs

      - name: Self-test (shared ledger round trip)
        run: node tests/test_sync.mjs

      - name: Run the model
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python -m pipeline.build --full
          else
            python -m pipeline.build
          fi

      # state/ has to be committed back or the model forgets everything between
      # runs: the odds snapshots that make grading and closing-line value
      # possible, plus the shadow book that tracks tier accuracy. Actual wagers
      # are manual browser-local entries and are never committed by the bot.
      - name: Commit refreshed data
        run: |
          git config user.name  "nfl-edge bot"
          git config user.email "actions@github.com"
          # Public feed/model allowlist. Browser-local wagers and the
          # financial-style shadow performance summary are never staged.
          git add state/model_accuracy.json site/data/accuracy.json
          git add -A -- \
            state/fpi_*.json state/forecasts.json state/games_*.json \
            state/lines.json state/rank_history.json state/shadow.json \
            site/data/board.json site/data/forecasts.json site/data/games.json \
            site/data/games_detail.json site/data/injuries.json site/data/meta.json \
            site/data/news.json site/data/outlook.json site/data/ratings.json \
            site/data/simulator.json site/data/team_stats.json site/data/weather.json site/data/performance.json
          git diff --staged --quiet || git commit -m "Refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have pushed while this one was working.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

      - name: Prepare public Best Bets site
        run: python tools/prepare_public_site.py

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public_site

  # Deploying has to be its own job with the github-pages environment declared.
  # actions/deploy-pages refuses to run without it, which is a confusing failure
  # right at the end of an otherwise successful run.
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
